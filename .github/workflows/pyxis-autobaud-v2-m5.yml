name: Pyxis Autobaud V2 M5 TIM2 capture software checks

on:
  push:
    branches:
      - feature/pyxis-autobaud-v2-m5
  pull_request:
    branches:
      - feature/pyxis-autobaud-v2-m4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-m5:
    name: M0-M5 native C11 and Python regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Verify host compiler
        run: |
          python3 --version
          gcc --version
      - name: Exercise TIM2 edge buffer and inherited tests
        run: python3 tests/test_pyxis_autobaud_v2_m5.py

  arm-m5:
    name: M5 STM32H563 capture and IRQ syntax build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Install ARM cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Compile guarded M4/M5 hardware code with capture enabled
        run: sh tests/autobaud_v2/check_m5_arm_syntax.sh
